name: Build desktop app

# PyInstaller bundles the host's real interpreter and native libraries, so it
# cannot cross-compile. Running one job per target platform is how a single
# machine still produces every build: push a tag and collect the artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            artifact: sarmesh-linux-x86_64
          - name: windows-x86_64
            runner: windows-2022
            artifact: sarmesh-windows-x86_64
          # Native arm64 runners are free for public repositories; on a private
          # repo they need a paid plan. If this job is unavailable, build the
          # Pi bundle locally instead with scripts/build_pi.sh (QEMU).
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: sarmesh-linux-arm64

    steps:
      - uses: actions/checkout@v4

      # PySide6 is imported during PyInstaller's analysis, and it pulls these
      # in even though the build itself is headless.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Build desktop bundle
        run: uv run python scripts/build_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/sarmesh
          if-no-files-found: error
