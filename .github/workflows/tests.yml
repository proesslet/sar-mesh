name: Tests

# Runs on every push and pull request, unlike the build workflow, which only
# fires on a tag. A broken ingest path should be visible on the commit that
# caused it, not weeks later when a release is cut.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      # Honoured by both `uv sync` and `uv run`, so the two cannot disagree
      # about which interpreter the suite ran on.
      UV_PYTHON: ${{ matrix.python }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor in requires-python. Development happens on 3.13, so this
          # is the leg that catches a 3.13-only syntax or stdlib change.
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          # SARMesh ships a Windows bundle, and storage/paths.py branches on
          # the platform, so the path and SQLite tests need to run there too.
          - os: windows-2022
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails on a stale lockfile rather than quietly resolving
      # something other than what a developer has installed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Each step runs even if an earlier one failed, so one push surfaces
      # every complaint rather than one per round trip.
      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        if: '!cancelled()'
        run: uv run ruff format --check src tests scripts

      - name: Type check
        if: '!cancelled()'
        run: uv run mypy src scripts
