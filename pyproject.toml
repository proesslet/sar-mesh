[project]
name = "sarmesh"
version = "0.1.0"
description = "Offline search and rescue personnel tracking over mesh radio networks"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Preston Roesslet", email = "proesslet@gmail.com"},
]
dependencies = [
    "fastapi>=0.141.1",
    "meshtastic",
    "pyside6>=6.11.2",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
sarmesh = "sarmesh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarmesh"]
# The built frontend is gitignored, and hatchling excludes VCS-ignored files by
# default. Without this the wheel installs with no UI to serve.
artifacts = ["src/sarmesh/web/static/**"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument return inert marker objects rather than shared mutable
# defaults, so B008 does not apply to them.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = [
    "meshtastic",
    "meshtastic.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
